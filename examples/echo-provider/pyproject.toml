[project]
name = "htmlrender-echo-provider"
version = "0.1.0"
description = "Minimal third-party render engine validating the htmlrender provider SDK"
authors = [{ name = "Tacrolimus", email = "balconyjh@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "entari-plugin-htmlrender>=0.1.0,<0.2.0",
]

[project.entry-points."entari_plugin_htmlrender.providers.v2"]
echo = "htmlrender_echo_provider:PROVIDER"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/htmlrender_echo_provider"]
