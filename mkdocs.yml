site_name: entari-plugin-htmlrender
site_url:
  !ENV [DOCS_SITE_URL, "https://entanex.github.io/entari-plugin-htmlrender/"]
site_description: >-
  面向 Entari 的可插拔图片渲染基础设施：使用、配置、API、扩展与维护文档

# Repository
repo_name: entanex/entari-plugin-htmlrender
repo_url: https://github.com/entanex/entari-plugin-htmlrender
edit_uri: edit/main/docs/

# Copyright
copyright: "&copy; 2026 Tacrolimus"

# Configuration
theme:
  language: zh
  variant: modern
  custom_dir: docs/overrides
  features:
    - announce.dismiss
    - content.action.copy
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: lucide/sun-moon
        name: 切换到浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon-star
        name: 跟随系统主题
  favicon: assets/logo.svg
  logo: assets/logo.svg
  icon:
    tag:
      default: lucide/hash

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - assets/javascripts/mermaid-11.16.0.min.js

# Plugins
plugins:
  - search
  - tags
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_root_full_path: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            inherited_members: false
            show_source: false
  - llmstxt:
      full_output: llms-full.txt
      # Keep chapter membership and reading order aligned with nav.
      sections:
        首页:
          - index.md
        开始使用:
          - start/index.md
          - start/quickstart.md
          - start/choosing-provider.md
          - start/migration-v0.2.md
        使用指南:
          - guides/index.md
          - guides/rendering-content.md
          - guides/templates-and-resources.md
          - guides/browser-automation.md
          - guides/python-drawing.md
          - guides/raster-scenes.md
          - guides/switching-engines.md
          - guides/best-practices.md
        配置与部署:
          - configuration/index.md
          - configuration/dotenv.md
          - configuration/lifecycle.md
          - configuration/providers/index.md
          - configuration/providers/takumi.md
          - configuration/providers/playwright.md
          - configuration/remote-playwright.md
          - configuration/graphics/index.md
          - configuration/graphics/pillow.md
          - configuration/graphics/skia.md
          - configuration/resources.md
          - configuration/security.md
          - configuration/html-rendering.md
          - guides/cache-lifecycle.md
          - configuration/observability.md
          - configuration/troubleshooting.md
          - configuration/faq.md
        API 参考:
          - reference/api.md
          - reference/glossary.md
        扩展开发:
          - extensions/index.md
          - reference/architecture.md
          - extensions/provider-contract.md
          - extensions/provider-development.md
        维护者指南:
          - project/index.md
          - project/contributing.md
          - project/engineering-workflow.md
          - project/coding-standards.md
          - project/semantic-api.md
          - project/testing.md
          - project/ci.md
          - project/commit-messages.md
          - project/pull-requests.md
          - project/governance.md
          - project/release.md
          - project/documentation-versioning.md

# Additional configuration
extra:
  homepage: https://github.com/entanex/entari-plugin-htmlrender
  scope: !ENV [DOCS_SCOPE, "/"]
  version:
    provider: !ENV [DOCS_VERSION_PROVIDER, "mike"]
    default: latest
    alias: true
  annotate:
    json: [.s2]
  status:
    new: 新增
    deprecated: 已弃用
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/entanex/entari-plugin-htmlrender
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/entari-plugin-htmlrender/
  tags:
    default: default

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: entanex
      repo: entari-plugin-htmlrender
  - pymdownx.mark
  - pymdownx.quotes:
      callouts: true
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.blocks.caption
  - zensical.extensions.glightbox:
      auto_caption: true

# Validation
validation:
  unresolved_references: true
  unresolved_footnotes: true
  unused_definitions: true
  unused_footnotes: true
  shadowed_definitions: true
  shadowed_footnotes: true
  invalid_links: true
  invalid_link_anchors: true

# Page tree
nav:
  - 首页: index.md
  - 开始使用:
      - 入门路径: start/index.md
      - 快速开始: start/quickstart.md
      - 选择 Provider: start/choosing-provider.md
      - 升级到 0.2: start/migration-v0.2.md
  - 使用指南:
      - 指南总览: guides/index.md
      - 内容渲染:
          - 渲染内容: guides/rendering-content.md
          - 模板与资源: guides/templates-and-resources.md
          - 操作浏览器页面: guides/browser-automation.md
      - Python 与场景绘图:
          - Python 绘图: guides/python-drawing.md
          - 绘制 RasterScene: guides/raster-scenes.md
      - 组合与集成:
          - 多引擎与切换: guides/switching-engines.md
          - 最佳实践: guides/best-practices.md
  - 配置与部署:
      - 配置与部署总览: configuration/index.md
      - 基础配置:
          - 环境变量与配置文件: configuration/dotenv.md
          - 启动与生命周期: configuration/lifecycle.md
      - HTML Provider:
          - Provider 总览: configuration/providers/index.md
          - Takumi: configuration/providers/takumi.md
          - Playwright: configuration/providers/playwright.md
          - 远程 Playwright: configuration/remote-playwright.md
      - 绘图后端:
          - 绘图后端总览: configuration/graphics/index.md
          - Pillow: configuration/graphics/pillow.md
          - Skia: configuration/graphics/skia.md
      - 资源与预算:
          - 资源与访问策略: configuration/resources.md
          - 安全须知: configuration/security.md
          - HTML 渲染预算: configuration/html-rendering.md
          - 缓存组件与调优: guides/cache-lifecycle.md
      - 诊断与排障:
          - 可选依赖与可观测性: configuration/observability.md
          - 故障排查: configuration/troubleshooting.md
          - 常见问题: configuration/faq.md
  - API 参考:
      - 公开 API 速查: reference/api.md
      - 术语表: reference/glossary.md
  - 扩展开发:
      - 扩展开发总览: extensions/index.md
      - 运行机制:
          - 架构与运行原理: reference/architecture.md
      - Provider 开发:
          - Provider 契约: extensions/provider-contract.md
          - Provider 开发指南: extensions/provider-development.md
  - 维护者指南:
      - 维护者指南总览: project/index.md
      - 贡献与设计:
          - 贡献指南: project/contributing.md
          - 工程协作流程: project/engineering-workflow.md
          - 编码规范: project/coding-standards.md
          - 语义 API 设计: project/semantic-api.md
      - 检查与提交:
          - 测试矩阵: project/testing.md
          - CI Actions: project/ci.md
          - 提交消息指南: project/commit-messages.md
          - Pull Request 生命周期: project/pull-requests.md
      - 发布与维护:
          - 仓库治理与保护: project/governance.md
          - 发布流程: project/release.md
          - 文档版本管理: project/documentation-versioning.md
