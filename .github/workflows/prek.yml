name: Prek

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep every trusted main SHA alive: Auto Tag joins the exact push runs.
  # Pull request updates still replace stale checks for the same PR ref.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prek:
    name: Prek
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          install-only: true
          prek-version: "0.3.9"

      - name: Run repository hooks
        run: prek run --all-files --show-diff-on-failure --color=always

      - name: Validate GitHub Actions workflows
        run: prek run actionlint --all-files --hook-stage=manual --show-diff-on-failure --color=always
