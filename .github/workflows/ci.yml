name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep every trusted main SHA alive: Auto Tag joins the exact push runs.
  # Pull request updates still replace stale checks for the same PR ref.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: ruff
            name: Ruff
          - check: ty
            name: Ty
          - check: basedpyright
            name: Basedpyright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up project
        uses: ./.github/actions/setup-project
        with:
          cache-suffix: quality-${{ matrix.check }}-${{ github.event_name }}
          dependency-scope: all

      - name: Run ${{ matrix.name }}
        shell: bash
        env:
          QUALITY_CHECK: ${{ matrix.check }}
        run: |
          set -euo pipefail
          case "${QUALITY_CHECK}" in
            ruff)
              make ruff-format-check ruff-check
              ;;
            ty)
              make ty
              ;;
            basedpyright)
              make typecheck
              ;;
            *)
              echo "::error::Unsupported quality check: ${QUALITY_CHECK}"
              exit 1
              ;;
          esac

  package:
    name: Package Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUILD_LOG: package-build.log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up project
        uses: ./.github/actions/setup-project
        with:
          cache-suffix: package-${{ github.event_name }}
          dependency-scope: none

      - name: Install Skia runtime libraries
        uses: ./.github/actions/setup-skia-runtime

      - name: Build and verify distributions
        uses: ./.github/actions/build-distributions
        with:
          log-file: ${{ env.BUILD_LOG }}

      - name: Upload built distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-build-logs
          path: ${{ env.BUILD_LOG }}
          if-no-files-found: warn
          retention-days: 14

  package-wheel-smoke:
    name: Wheel Smoke (Python ${{ matrix.python-version }})
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up project
        uses: ./.github/actions/setup-project
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: package-wheel-${{ matrix.python-version }}-${{ github.event_name }}
          dependency-scope: none

      - name: Install Skia runtime libraries
        uses: ./.github/actions/setup-skia-runtime

      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-dist
          path: dist

      - name: Verify installed wheel
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          python3 scripts/verify_distribution.py dist \
            --expected-version "$(uv version --short)" \
            --python "${PYTHON_VERSION}" \
            --uv uv \
            --wheel-only-smoke

  remote-browser-render:
    name: Remote Browser Render Smoke (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RENDER_IMAGE: htmlrender-remote-test:ci
      PLAYWRIGHT_IMAGE: htmlrender-playwright:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build remote smoke render image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: tests/infra/dockerfile.remote-test
          load: true
          tags: ${{ env.RENDER_IMAGE }}
          cache-from: type=gha,scope=remote-smoke
          cache-to: type=gha,scope=remote-smoke,mode=max
          build-args: |
            PYTHON_BASE_IMAGE=python:3.12-bookworm
            UV_VERSION=0.11.28

      - name: Resolve Playwright version
        id: playwright-version
        shell: bash
        run: |
          PLAYWRIGHT_VERSION=$(python3 - <<'PY'
          from pathlib import Path

          try:
              import tomllib
          except ModuleNotFoundError:
              tomllib = None


          def parse_package_version(text, package_name):
              if tomllib is not None:
                  lock = tomllib.loads(text)
                  for package in lock["package"]:
                      if package["name"] == package_name:
                          return package["version"]
                  return None

              current_name = None
              for line in text.splitlines():
                  stripped = line.strip()
                  if stripped == "[[package]]":
                      current_name = None
                      continue
                  if stripped.startswith("name = "):
                      current_name = stripped.split('"', 2)[1]
                      continue
                  if current_name == package_name and stripped.startswith("version = "):
                      return stripped.split('"', 2)[1]
              return None


          version = parse_package_version(Path("uv.lock").read_text(), "playwright")
          if version is None:
              raise SystemExit("playwright package not found in uv.lock")
          print(version)
          PY
          )
          echo "version=${PLAYWRIGHT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Resolved Playwright version: ${PLAYWRIGHT_VERSION}"

      - name: Build playwright server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: tests/infra/dockerfile.playwright-server
          load: true
          tags: ${{ env.PLAYWRIGHT_IMAGE }}
          cache-from: type=gha,scope=playwright-server
          cache-to: type=gha,scope=playwright-server,mode=max
          build-args: |
            PLAYWRIGHT_VERSION=${{ steps.playwright-version.outputs.version }}

      - name: Build and run remote smoke
        run: docker compose -f tests/infra/docker-compose.remote-test.yaml up --abort-on-container-exit --exit-code-from render

      - name: Capture compose logs
        if: ${{ always() }}
        run: docker compose -f tests/infra/docker-compose.remote-test.yaml logs > remote-smoke-compose.log

      - name: Upload remote smoke logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remote-smoke-compose-logs
          path: remote-smoke-compose.log
          if-no-files-found: warn
          retention-days: 14

      - name: Teardown compose
        if: always()
        run: docker compose -f tests/infra/docker-compose.remote-test.yaml down -v

  entari-load:
    name: Entari Load (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up project
        uses: ./.github/actions/setup-project
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: entari-load-${{ matrix.python-version }}-${{ github.event_name }}
          dependency-scope: test

      - name: Verify library and Entari loading
        run: uv run pytest tests/entari/test_plugin.py -q --no-cov

  result:
    name: Required Checks
    if: always()
    needs:
      - quality
      - package
      - package-wheel-smoke
      - remote-browser-render
      - entari-load
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CI layer
        shell: bash
        env:
          ENTARI_LOAD_RESULT: ${{ needs.entari-load.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          PACKAGE_WHEEL_SMOKE_RESULT: ${{ needs.package-wheel-smoke.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          REMOTE_BROWSER_RESULT: ${{ needs.remote-browser-render.result }}
        run: |
          failed=false
          for result in \
            "${QUALITY_RESULT}" \
            "${PACKAGE_RESULT}" \
            "${PACKAGE_WHEEL_SMOKE_RESULT}" \
            "${REMOTE_BROWSER_RESULT}" \
            "${ENTARI_LOAD_RESULT}"; do
            if [[ "${result}" != "success" ]]; then
              failed=true
            fi
          done
          if [[ "${failed}" == "true" ]]; then
            echo "::error::At least one required CI layer did not succeed."
            exit 1
          fi
          echo "All required CI layers succeeded."
